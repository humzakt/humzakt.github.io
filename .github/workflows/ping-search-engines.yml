name: Notify Search Engines

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - 'blog/**'
      - 'sitemap.xml'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          KEY=$(cat indexnow-key.txt)
          URLS=$(grep -oP 'https://humzakt\.github\.io[^<]+' sitemap.xml | head -50)
          if [ -z "$URLS" ]; then
            echo "No URLs found in sitemap.xml, skipping."
            exit 0
          fi
          URL_JSON=$(echo "$URLS" | python3 -c "
          import sys, json
          lines = [l for l in sys.stdin.read().strip().split('\n') if l]
          print(json.dumps(lines))
          ")
          COUNT=$(echo "$URLS" | wc -l | tr -d ' ')
          echo "Submitting $COUNT URLs to IndexNow..."
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"humzakt.github.io\",\"key\":\"$KEY\",\"urlList\":$URL_JSON}")
          echo "IndexNow response: HTTP $HTTP_CODE"
