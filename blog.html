  <script>
  (function() {
    var grid = document.getElementById('blog-grid');
    var filtersContainer = document.getElementById('blog-filters');

    var themeLabels = {
      'infrastructure': 'Infrastructure',
      'ml-ai': 'ML / AI',
      'devops': 'DevOps',
      'api-design': 'API Design',
      'performance': 'Performance',
      'security': 'Security'
    };

    function wireFilterButtons() {
      filtersContainer.querySelectorAll('.blog-filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          filtersContainer.querySelectorAll('.blog-filter-btn').forEach(function(b) {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');

          var filter = btn.getAttribute('data-filter');
          document.querySelectorAll('.blog-card').forEach(function(card) {
            if (filter === 'all' || (card.getAttribute('data-themes') || '').includes(filter)) {
              card.style.display = '';
            } else {
              card.style.display = 'none';
            }
          });
        });
      });
    }

    wireFilterButtons();

    async function loadArticles() {
      try {
        var resp = await fetch('blog/article-meta.json');
        if (resp.ok) {
          var articles = await resp.json();
          upgradeFilters(articles);
          renderArticles(articles);
          return;
        }
      } catch (e) { console.error('Failed to load articles:', e); }
      grid.innerHTML = '<p class="blog-empty">Articles coming soon — stay tuned!</p>';
    }

    function upgradeFilters(articles) {
      var counts = {};
      articles.forEach(function(a) {
        (a.themes || []).forEach(function(t) {
          counts[t] = (counts[t] || 0) + 1;
        });
      });

      var sorted = Object.keys(counts).sort(function(a, b) {
        return counts[b] - counts[a];
      });

      filtersContainer.innerHTML = '';

      var allBtn = document.createElement('button');
      allBtn.className = 'blog-filter-btn active';
      allBtn.setAttribute('data-filter', 'all');
      allBtn.setAttribute('role', 'tab');
      allBtn.setAttribute('aria-selected', 'true');
      allBtn.textContent = 'All (' + articles.length + ')';
      filtersContainer.appendChild(allBtn);

      sorted.forEach(function(theme) {
        var label = themeLabels[theme] || theme.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
        var btn = document.createElement('button');
        btn.className = 'blog-filter-btn';
        btn.setAttribute('data-filter', theme);
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', 'false');
        btn.textContent = label + ' (' + counts[theme] + ')';
        filtersContainer.appendChild(btn);
      });

      wireFilterButtons();
    }

    function renderArticles(articles) {
      if (!articles.length) {
        grid.innerHTML = '<p class="blog-empty">Articles coming soon — stay tuned!</p>';
        return;
      }
      grid.innerHTML = '';
      articles.forEach(function(article) {
        var themes = (article.themes || []).join(' ');
        var date = article.date ? new Date(article.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
        var primaryPlatform = Object.keys(article.platforms || {})[0] || 'medium';
        var platformUrl = article.platforms ? article.platforms[primaryPlatform] : '#';
        var isInternal = platformUrl.includes('humzakt.github.io/blog/') || platformUrl.startsWith('blog/');

        var card = document.createElement('div');
        card.className = 'blog-card';
        card.setAttribute('data-themes', themes);
        card.setAttribute('data-href', platformUrl);
        card.setAttribute('role', 'link');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', article.title);

        var tagsHtml = (article.components || []).slice(0, 4).map(function(c) {
          return '<span class="blog-card-tag">' + c + '</span>';
        }).join('');

        card.innerHTML =
          '<span class="blog-card-date">' + date + '</span>' +
          '<h3>' + article.title + '</h3>' +
          '<p>' + article.summary + '</p>' +
          '<div class="blog-card-tags">' + tagsHtml + '</div>';

        card.addEventListener('click', function() {
          if (isInternal) {
            window.location.href = platformUrl;
          } else {
            window.open(platformUrl, '_blank', 'noopener');
          }
        });
        card.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            card.click();
          }
        });

        grid.appendChild(card);
      });
    }

    loadArticles();
  })();
  </script>
